# docker-java falls back to API version 1.32 when nothing is configured, which Docker
# Engine 29+ rejects (minimum 1.40 as of 29.3) — Testcontainers then reports "no valid
# Docker environment" and the integration tests silently self-skip. 1.41 is old enough
# for Engine 20.10+ daemons and new enough for Docker 29.3+'s floor.
api.version=1.41
