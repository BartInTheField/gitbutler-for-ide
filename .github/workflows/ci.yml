name: CI

# Only PRs and pushes to main spawn workflow runs — plain branch pushes would
# otherwise start a vacuous pipeline that can race the PR pipeline. Releases
# live in release.yml and are triggered manually.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Changelog gate: every PR must add an entry to at least one CHANGELOG.md under
  # '## Unreleased' (core/CHANGELOG.md, jetbrains/CHANGELOG.md, vscode/CHANGELOG.md).
  changelog:
    name: Changelog gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        run: |
          # Defensive: the three-dot diff below needs a merge base with the
          # target branch, so make sure we have it locally.
          git fetch origin "${{ github.base_ref }}"
          # Require at least one ADDED, non-blank, non-heading line in ANY of
          # core/CHANGELOG.md, jetbrains/CHANGELOG.md, vscode/CHANGELOG.md
          ADDED=$(git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- core/CHANGELOG.md jetbrains/CHANGELOG.md vscode/CHANGELOG.md | grep -E '^\+[^+]' | grep -vE '^\+##' | grep -vE '^\+[[:space:]]*$' || true)
          if [ -n "$ADDED" ]; then
            echo "CHANGELOG.md entry added — OK"
          else
            echo "ERROR: this PR does not add an entry to any CHANGELOG.md file."
            echo "Add an entry under '## Unreleased' in core/CHANGELOG.md, jetbrains/CHANGELOG.md,"
            echo "or vscode/CHANGELOG.md in the matching section (Features / Fixes / Internal improvements) and push again."
            exit 1
          fi

  core:
    name: Test core module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :core:allTests --no-daemon

  jetbrains:
    name: Test and build JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :jetbrains:test :jetbrains:buildPlugin --no-daemon

  vscode:
    name: Build VSCode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: ./gradlew :core:jsNodeProductionLibraryDistribution --no-daemon

      - run: cd vscode && npm install && npm run compile

      # Core e2e: the container suite provisions `but` in Docker (available on the runner)
      # and drives the compiled core against a real GitButler workspace. The host-`but`
      # suite self-skips here (no `but` on the runner).
      - run: cd vscode && npm run test:e2e

  vscode-ui:
    name: VSCode UI e2e (VSCodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `but` on the runner so the UI test can seed a real GitButler workspace.
      - run: curl -fsSL https://gitbutler.com/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # VSCodium (open-source VS Code build) — the UI test drives it via Playwright's
      # Electron API, which attaches to any Electron binary (no ChromeDriver matching).
      - run: |
          VER=$(curl -fsSL https://api.github.com/repos/VSCodium/vscodium/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -fsSL -o /tmp/codium.tar.gz "https://github.com/VSCodium/vscodium/releases/download/${VER}/VSCodium-linux-x64-${VER}.tar.gz"
          mkdir -p /tmp/codium && tar -xzf /tmp/codium.tar.gz -C /tmp/codium
          echo "CODIUM_BIN=/tmp/codium/codium" >> "$GITHUB_ENV"

      - run: ./gradlew :core:jsNodeProductionLibraryDistribution --no-daemon

      - run: cd vscode && npm install && npm run compile

      # xvfb gives the headless runner a display; the screenshot lands in vscode/screenshots/.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: cd vscode && xvfb-run -a npm run test:ui:codium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-ui-screenshots
          path: |
            vscode/screenshots/
            vscode/test-resources/screenshots/
          if-no-files-found: ignore
