name: Release

# Releases are cut only by manually running this workflow on main from the
# Actions tab. Nothing here reacts to pushes or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same gate as the CI workflow: never cut a release from a build that fails.
  test:
    name: Test monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: ./gradlew :core:allTests :jetbrains:test :jetbrains:buildPlugin :core:jsNodeProductionLibraryDistribution --no-daemon

      - run: cd vscode && npm install && npm run compile

  # CalVer with a per-day counter: YYYY.M.D.N where N is 1 for the first release
  # of the day and increments for each further release the same day. The counter
  # is derived from existing releases, so it resets naturally each new day.
  release:
    name: Cut release
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # RELEASE_TOKEN is a PAT whose user is on the main ruleset's bypass list,
      # so the changelog-cut commit at the end of this job can be pushed to main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute versions and release plan
        run: |
          set -e
          Y=$(date -u +%Y)
          M=$(date -u +%m | sed 's/^0//')
          D=$(date -u +%d | sed 's/^0//')
          DATE="$Y.$M.$D"

          # Extract the '## Unreleased' body of a CHANGELOG, dropping empty
          # '### ...' subsections and collapsing blank-line runs.
          extract_unreleased() {
            file="$1"
            notes=$(awk '/^## Unreleased$/{flag=1;next} /^## /{flag=0} flag' "$file")
            printf '%s\n' "$notes" | awk '
              function flush() {
                if (heading == "" || has) {
                  if (heading != "") print heading
                  printf "%s", buf
                }
                heading = ""; buf = ""; has = 0
              }
              /^### / { flush(); heading = $0; next }
              { buf = buf $0 "\n"; if ($0 ~ /[^[:space:]]/) has = 1 }
              END { flush() }
            ' | awk '
              NF { if (started && pending) print ""; print; started = 1; pending = 0; next }
              { pending = 1 }
            '
          }

          # True when an Unreleased body has at least one real (non-heading,
          # non-blank) line.
          has_content() {
            [ -n "$(printf '%s\n' "$1" | grep -v '^###' | grep -v '^[[:space:]]*$' || true)" ]
          }

          CORE_NOTES=$(extract_unreleased core/CHANGELOG.md)
          JB_NOTES=$(extract_unreleased jetbrains/CHANGELOG.md)
          VS_NOTES=$(extract_unreleased vscode/CHANGELOG.md)

          CORE_HAS=false; JB_HAS=false; VS_HAS=false
          has_content "$CORE_NOTES" && CORE_HAS=true
          has_content "$JB_NOTES" && JB_HAS=true
          has_content "$VS_NOTES" && VS_HAS=true

          # :core ships inside both artifacts, so a core-only change releases both.
          JB_RELEASE=false; VS_RELEASE=false
          { [ "$JB_HAS" = true ] || [ "$CORE_HAS" = true ]; } && JB_RELEASE=true
          { [ "$VS_HAS" = true ] || [ "$CORE_HAS" = true ]; } && VS_RELEASE=true

          if [ "$JB_RELEASE" = false ] && [ "$VS_RELEASE" = false ]; then
            echo "ERROR: '## Unreleased' sections in core/CHANGELOG.md, jetbrains/CHANGELOG.md, and vscode/CHANGELOG.md are all empty."
            echo "Add at least one changelog entry before cutting a release."
            exit 1
          fi

          # Shared per-day counter across both components so bare-CalVer tags stay
          # unique: base off existing releases, then hand out sequential counters
          # (JetBrains first, then VSCode) to whichever components release.
          MAX=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep "^${DATE}\." | sed "s/^${DATE}\.//" | sort -n | tail -1 || true)
          N=${MAX:-0}

          JB_VERSION=""; VS_VERSION=""
          if [ "$JB_RELEASE" = true ]; then N=$((N + 1)); JB_VERSION="$DATE.$N"; fi
          if [ "$VS_RELEASE" = true ]; then N=$((N + 1)); VS_VERSION="$DATE.$N"; fi

          # Per-component release notes: the component's own section first, then
          # the shared Core section folded in when core changed.
          build_notes() {
            out="$1"; label="$2"; comp_notes="$3"
            : > "$out"
            if [ -n "$comp_notes" ]; then
              printf '## %s\n' "$label" >> "$out"
              printf '%s\n\n' "$comp_notes" >> "$out"
            fi
            if [ "$CORE_HAS" = true ]; then
              printf '## Core\n' >> "$out"
              printf '%s\n\n' "$CORE_NOTES" >> "$out"
            fi
          }
          [ "$JB_RELEASE" = true ] && build_notes jb_notes.md "JetBrains" "$JB_NOTES"
          [ "$VS_RELEASE" = true ] && build_notes vs_notes.md "VSCode" "$VS_NOTES"

          {
            echo "CORE_HAS=$CORE_HAS"
            echo "JB_RELEASE=$JB_RELEASE"
            echo "VS_RELEASE=$VS_RELEASE"
            echo "JB_VERSION=$JB_VERSION"
            echo "VS_VERSION=$VS_VERSION"
          } >> "$GITHUB_ENV"

          echo "Plan: jetbrains=$JB_RELEASE ($JB_VERSION), vscode=$VS_RELEASE ($VS_VERSION), core folded=$CORE_HAS"

      - name: Build artifacts
        run: |
          set -e
          if [ "$JB_RELEASE" = true ]; then
            ./gradlew :jetbrains:buildPlugin "-PpluginVersion=$JB_VERSION" "-PcoreVersion=$JB_VERSION" --no-daemon
          fi
          if [ "$VS_RELEASE" = true ]; then
            ./gradlew :core:jsNodeProductionLibraryDistribution "-PcoreVersion=$VS_VERSION" --no-daemon
            cd vscode
            npm install
            # vsce requires a 3-part semver; CalVer is YYYY.M.D.N, so drop the daily
            # counter for the manifest version. The full CalVer stays in the filename.
            VSIX_VER=$(echo "$VS_VERSION" | cut -d. -f1-3)
            npm version --no-git-tag-version --allow-same-version "$VSIX_VER"
            npm run compile
            npx @vscode/vsce package --no-dependencies -o "gitbutler-for-ide-$VS_VERSION.vsix"
          fi

      - name: Create GitHub releases
        run: |
          set -e
          if [ "$JB_RELEASE" = true ]; then
            ZIP=$(ls jetbrains/build/distributions/*-"$JB_VERSION".zip 2>/dev/null | head -1 || true)
            if [ -z "$ZIP" ]; then
              ZIP=$(ls jetbrains/build/distributions/*.zip 2>/dev/null | head -1 || true)
            fi
            echo "Releasing JetBrains $JB_VERSION with asset: $ZIP"
            gh release create "$JB_VERSION" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "JetBrains $JB_VERSION" \
              --notes-file jb_notes.md
          fi
          if [ "$VS_RELEASE" = true ]; then
            VSIX="vscode/gitbutler-for-ide-$VS_VERSION.vsix"
            echo "Releasing VSCode $VS_VERSION with asset: $VSIX"
            gh release create "$VS_VERSION" "$VSIX" \
              --target "$GITHUB_SHA" \
              --title "VSCode $VS_VERSION" \
              --notes-file vs_notes.md
          fi

      # After a release, stamp the released version into each affected CHANGELOG.md:
      # the current '## Unreleased' heading becomes '## <VERSION> - <date>' and a
      # fresh empty Unreleased scaffold is inserted above it. Only changelogs whose
      # component was released are cut. The commit carries [skip ci] so the push
      # back to main does not trigger another workflow run.
      - name: Cut changelogs for next release
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)

          cut_changelog() {
            file="$1"; ver="$2"
            awk -v ver="$ver" -v day="$TODAY" '
              /^## Unreleased$/ && !done {
                print "## Unreleased"
                print ""
                print "### Features"
                print ""
                print "### Fixes"
                print ""
                print "### Internal improvements"
                print ""
                print "## " ver " - " day
                done=1
                next
              }
              { print }
            ' "$file" > "$file.new"
            mv "$file.new" "$file"
          }

          FILES=""
          if [ "$JB_RELEASE" = true ]; then
            cut_changelog jetbrains/CHANGELOG.md "$JB_VERSION"
            FILES="$FILES jetbrains/CHANGELOG.md"
          fi
          if [ "$VS_RELEASE" = true ]; then
            cut_changelog vscode/CHANGELOG.md "$VS_VERSION"
            FILES="$FILES vscode/CHANGELOG.md"
          fi
          if [ "$CORE_HAS" = true ]; then
            cut_changelog core/CHANGELOG.md "$JB_VERSION / $VS_VERSION"
            FILES="$FILES core/CHANGELOG.md"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: cut changelogs [skip ci]"
          # Protects against anything having landed on main since the workflow
          # started — replay the single changelog commit onto the current tip.
          git fetch origin main
          git rebase --autostash FETCH_HEAD
          git push origin HEAD:main
